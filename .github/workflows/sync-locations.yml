name: Refresh Wonder locations

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Attempt directory refresh
        id: sync
        continue-on-error: true
        run: npm run sync:locations
      - name: Preserve the last validated snapshot when the source blocks automation
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Wonder's directory blocked the automated refresh. Keeping the last validated snapshot."
      - run: npm run lint
      - run: npm run build
      - name: Commit verified location changes
        run: |
          if git diff --quiet -- app/location-data.json; then exit 0; fi
          git config user.name "wonder-location-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/location-data.json
          git commit -m "Refresh Wonder location data"
          git push
